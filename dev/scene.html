<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Scene harness</title>
    <style>
      body { margin: 0; background: #b6c1b5; }
      canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      #c { width: 720px; height: 400px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      import { Scene } from "/src/scene/scene.ts";
      const q = new URLSearchParams(location.search);
      const canvas = document.getElementById("c");
      const scene = new Scene(canvas);
      document.body.style.background = q.get("paper") ?? "#b6c1b5";
      const hour = Number(q.get("hour") ?? 14);
      // Day 10 of June 2026 is dry; the harness searches for a rainy date when asked.
      let day = 10;
      if (q.get("rainday")) {
        const { skyAt } = await import("/src/scene/sky.ts");
        for (let d = 1; d <= 60; d++) { if (skyAt(new Date(2026, 5, d, 12)).rain) { day = d; break; } }
      }
      scene.setClock(() => new Date(2026, 5, day, Math.floor(hour), Math.round((hour % 1) * 60)));
      scene.setView({ mood: q.get("mood") ?? "idle", typingRate: Number(q.get("rate") ?? 0), tempoBpm: Number(q.get("bpm") ?? 60), reduceMotion: false,
        ink: q.get("ink") ?? "#2e2a27", paper: q.get("paper") ?? "#b6c1b5" });
      const notes = Number(q.get("notes") ?? 0);
      if (notes) scene.emitNotes(notes);
      // Advance deterministic frames so screenshots show mid-animation states.
      const frames = Number(q.get("frames") ?? 0);
      for (let i = 0; i < frames; i++) scene.renderOnce(1 / 30);
      scene.renderOnce(0);
      window.__scene = scene;
      window.__ready = true;
    </script>
  </body>
</html>
