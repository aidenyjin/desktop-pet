[package]
name = "sonatina"
version = "0.1.0"
description = "A little composer who lives in your menu bar and writes music while you work."
authors = ["Aiden Jin"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "sonatina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = { version = "2.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[features]
default = ["notifications"]
# Native notifications need the macOS SDK to compile; the Linux type-check
# script disables this feature.
notifications = ["dep:tauri-plugin-notification"]

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
incremental = true
